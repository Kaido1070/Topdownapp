name: Build iOS IPA

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Version
        run: |
          BASE=$(grep -E '^\s*MARKETING_VERSION:' ios/project.yml | head -1 | sed -E 's/.*"([0-9]+\.[0-9]+).*/\1/')
          echo "APP_VERSION=$BASE.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "Version $BASE.${{ github.run_number }} (${{ github.run_number }})"

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project ios/Topdown.xcodeproj -scheme Topdown \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} MARKETING_VERSION=${{ env.APP_VERSION }} \
            build > build.log 2>&1 || { grep -E "error:" -A3 build.log | head -300; exit 1; }
          grep -E "BUILD SUCCEEDED" build.log
          test -f build/Build/Products/Release-iphoneos/Topdown.app/Topdown

      - name: Show errors
        if: failure()
        run: grep -E "error:" -A3 build.log | head -200 || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Topdown.app Payload/
          zip -qry Topdown-unsigned.ipa Payload
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Payload/Topdown.app/Info.plist)
          BUILD=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" Payload/Topdown.app/Info.plist)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          cp Topdown-unsigned.ipa "Topdown-$VERSION-$BUILD.ipa"
          echo "Version $VERSION ($BUILD)"
          ls -lh *.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Topdown-ipa
          path: Topdown-unsigned.ipa

      - name: Publish to release
        if: github.event_name == 'workflow_dispatch' || github.ref_type == 'branch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-latest
          name: Topdown iOS ${{ env.VERSION }} (${{ env.BUILD }})
          prerelease: true
          make_latest: false
          files: |
            Topdown-unsigned.ipa
            Topdown-${{ env.VERSION }}-${{ env.BUILD }}.ipa
          body: "نسخة غير موقّعة من تطبيق Topdown للآيفون — الإصدار ${{ env.VERSION }} (بناء ${{ env.BUILD }}). وقّعها بأداتك قبل التثبيت."

  simulator-smoke:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build for simulator
        run: |
          brew install xcodegen
          cd ios && xcodegen generate && cd ..
          xcodebuild -project ios/Topdown.xcodeproj -scheme Topdown -configuration Debug \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO build > sim.log 2>&1 || { grep -E "error:" -A3 sim.log | head -200; exit 1; }
      - name: Start local Topdown backend
        run: |
          git clone --depth 1 https://github.com/Kaido1070/topdown backend
          cd backend
          mkdir -p dist && echo ok > dist/index.html
          printf 'TOPDOWN_PASSWORD=testpass\nSESSION_SECRET=testsecret\n' > .dev.vars
          rm -f wrangler.toml
          (npx --yes wrangler@4 pages dev dist --d1 DB=local-topdown --port 8788 --ip 127.0.0.1 > ../backend.log 2>&1 &)
          for i in $(seq 1 90); do curl -s http://127.0.0.1:8788/api/session && break; sleep 2; done
          curl -s -X POST -H 'content-type: application/json' -d '{"password":"testpass"}' http://127.0.0.1:8788/api/login || true
          python3 - <<'PY'
          import sqlite3, glob
          for db in glob.glob('.wrangler/state/v3/d1/**/*.sqlite', recursive=True):
              if 'metadata' in db: continue
              c = sqlite3.connect(db)
              for f in sorted(glob.glob('migrations/*.sql')):
                  try: c.executescript(open(f).read())
                  except Exception as e: print(db, f, e)
              c.commit()
          PY
          curl -s -X POST -H 'content-type: application/json' -d '{"password":"testpass"}' http://127.0.0.1:8788/api/login
          echo
          curl -s -o /dev/null -w "stories warmup %{http_code} %{time_total}s\n" "http://127.0.0.1:8788/api/session"

      - name: Launch and screenshot
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "Device $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build-sim/Build/Products/Debug-iphonesimulator/Topdown.app
          mkdir -p shots
          xcrun simctl launch "$UDID" com.topdown.app
          sleep 10
          xcrun simctl io "$UDID" screenshot shots/01-login.png
          ARGS="-smokeBaseURL http://127.0.0.1:8788/ -smokePassword testpass -notifyOnFinish NO"
          xcrun simctl launch --terminate-running-process "$UDID" com.topdown.app $ARGS
          sleep 40; xcrun simctl io "$UDID" screenshot shots/02-anime.png
          xcrun simctl launch --terminate-running-process "$UDID" com.topdown.app $ARGS -smokeTab stories
          sleep 40; xcrun simctl io "$UDID" screenshot shots/03-stories.png
          xcrun simctl launch --terminate-running-process "$UDID" com.topdown.app $ARGS -smokeTab switchStories
          sleep 40; xcrun simctl io "$UDID" screenshot shots/05-switch-stories.png
          xcrun simctl launch --terminate-running-process "$UDID" com.topdown.app $ARGS -smokeTab tabHop
          sleep 35; xcrun simctl io "$UDID" screenshot shots/07-tab-hop-stories.png
          xcrun simctl launch --terminate-running-process "$UDID" com.topdown.app $ARGS -smokeTab player
          sleep 30; xcrun simctl io "$UDID" screenshot shots/08-player.png
          xcrun simctl launch --terminate-running-process "$UDID" com.topdown.app $ARGS -smokeTab storyDownload
          sleep 25; xcrun simctl io "$UDID" screenshot shots/09-story-downloads.png
          sleep 50; xcrun simctl io "$UDID" screenshot shots/10-story-downloads-later.png
          xcrun simctl launch --terminate-running-process "$UDID" com.topdown.app $ARGS -smokeTab reader
          sleep 35; xcrun simctl io "$UDID" screenshot shots/06-reader.png
          xcrun simctl launch --terminate-running-process "$UDID" com.topdown.app $ARGS -smokeTab account
          sleep 15; xcrun simctl io "$UDID" screenshot shots/04-account.png
          pgrep -fl Topdown.app || { echo "APP NOT RUNNING (crash?)"; exit 1; }
          grep -E "GET /api|POST /api" backend.log | sed -E 's/\x1b\[[0-9;]*m//g' | sed -E 's/\?.*( [0-9]{3} )/\1/' | sort | uniq -c | sort -rn | head -40

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshots
          path: shots/
