name: Build iOS IPA

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project ios/Topdown.xcodeproj -scheme Topdown \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/Topdown.app

      - name: Show errors
        if: failure()
        run: grep -E "error:" -A3 build.log | head -200 || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Topdown.app Payload/
          zip -qry Topdown-unsigned.ipa Payload
          ls -lh Topdown-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Topdown-ipa
          path: Topdown-unsigned.ipa

      - name: Publish to release
        if: github.event_name == 'workflow_dispatch' || github.ref_type == 'branch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-latest
          name: Topdown iOS (latest build)
          prerelease: true
          make_latest: false
          files: Topdown-unsigned.ipa
          body: "نسخة غير موقّعة من تطبيق Topdown للآيفون. وقّعها بأداتك قبل التثبيت."
